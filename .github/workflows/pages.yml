name: Deploy site to GitHub Pages

# The legacy Jekyll builder chokes on this repo (it tries to process the Python
# and JSON files alongside the site). This workflow uploads the static files
# as-is instead — no Jekyll, real build logs when something breaks.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; don't cancel one that's mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site directory
        run: |
          mkdir _site
          # Frontend only — the backend, training scripts and tooling are in the
          # repo for version control but must not be published to the web root.
          # *.css is NOT optional: it was missing from this glob, so app.css
          # 404'd in production and every page rendered unstyled — the mobile
          # tab bar and sidebar dumped as raw blocks at the foot of the page.
          cp *.html *.css *.js *.svg _site/
          cp trefle-data.json _site/
          cp -R models _site/
          cp CNAME .nojekyll _site/
          # The icons, the manifest, robots, the sitemap, the card images and the
          # Discord domain proof were never in the globs above. That went unnoticed
          # while Pages still built this repo with the legacy Jekyll builder, which
          # copies the whole checkout; the moment this workflow became the deploy
          # source they all 404'd at once, which takes the install prompt, the tab
          # icon, the crawl rules and every social preview with them.
          cp favicon.ico *.png _site/
          cp manifest.json robots.txt sitemap.xml _site/
          cp -R assets .well-known _site/
          # These globs are FLAT — *.js does not descend into scripts/. That
          # directory went unpublished for its whole existence: api.js, ui.js,
          # router.js and all four view modules 404'd in production. It was
          # survivable only while every page carried its own inline copy of the
          # code; the moment directory.html started depending on api.js it
          # rendered an empty grid. Copy the tree, not a glob of it.
          cp -R scripts _site/
          # Tests ship in the repo, not to the web root.
          rm -f _site/scripts/*.test.mjs
          echo "--- published files ---"
          ls -la _site
          ls -la _site/scripts _site/scripts/views
          # Fail loudly rather than deploying a broken site again. Each of these
          # has already been shipped missing at least once.
          # nav.js and footer.js are here for a different reason than the rest:
          # they are not enhancements of markup that already exists, they ARE the
          # header and the footer. Every page ships a bare <div id="ff-footer">
          # hook, so a missing footer.js publishes 15 pages with no footer at all
          # rather than 15 pages with a slightly worse one.
          # sw.js is what makes the site installable: with no service worker the
          # browser never fires beforeinstallprompt, so the Install app row in the
          # drawer would never appear and the manifest would be decoration.
          for f in app.css nav.js footer.js sw.js \
                   scripts/api.js scripts/ui.js scripts/router.js \
                   scripts/lite.js scripts/vendor/tf.min.js \
                   scripts/ux.js \
                   scripts/views/home.js scripts/views/directory.js \
                   scripts/views/dashboard.js scripts/views/scanner.js \
                   favicon.svg favicon.ico icon-192.png icon-512.png \
                   icon-maskable-512.png apple-touch-icon.png \
                   manifest.json robots.txt sitemap.xml \
                   assets/og-cover.png .well-known/discord; do
            test -f "_site/$f" || { echo "FATAL: $f missing from _site"; exit 1; }
          done
          # Every same-origin src=/href= in the published HTML must resolve to a
          # real file. This is the check that would have caught both outages.
          for html in _site/*.html; do
            grep -oE '(src|href)="[^"#?:]+(\.js|\.css|\.svg|\.json)[^"]*"' "$html" \
              | sed -E 's/^(src|href)="//; s/"$//; s/\?.*$//' \
              | while read -r ref; do
                  case "$ref" in /*|http*) continue ;; esac
                  test -f "_site/$ref" || echo "MISSING: $ref (referenced by $(basename "$html"))"
                done
          done > /tmp/missing.txt
          cat /tmp/missing.txt
          test ! -s /tmp/missing.txt || { echo "FATAL: published HTML references files that were not deployed"; exit 1; }
          # The check above deliberately skips any ref starting with "/", because
          # it cannot know the server's rewrite rules. Every internal link on the
          # site is now exactly that shape, so that skip had grown to cover almost
          # all of them and a typo like "/directoy" would deploy in silence.
          # Resolve them the way Pages does: /name is served from name.html.
          for html in _site/*.html; do
            grep -oE 'href="/[^"]*"' "$html" \
              | sed -E 's/^href="//; s/"$//; s/[#?].*$//' \
              | while read -r ref; do
                  case "$ref" in
                    ""|/) continue ;;   # the site root, which is index.html
                    /*.*) continue ;;   # has an extension: an asset, checked above
                  esac
                  test -f "_site/${ref#/}.html" \
                    || echo "DEAD: $ref needs ${ref#/}.html (in $(basename "$html"))"
                done
          done > /tmp/deadpaths.txt
          # nav.js and footer.js are the other half of that surface. The top
          # bar, the sidebar, the mobile tab bar and the entire footer are
          # built in JS, so the links a reader actually clicks are in no HTML
          # file for the loop above to read. Scoped to these two on purpose:
          # scripts/api.js holds proxy paths (/trefle/plants) that are not
          # pages and would every one of them read as dead here.
          for js in _site/nav.js _site/footer.js; do
            { grep -oE 'href="/[^"]*"' "$js" | sed -E 's/^href="//; s/"$//'; grep -oE "'/[^']*'" "$js" | tr -d "'"; } | sed -E 's/[#?].*$//' | sort -u | while read -r ref; do
                  case "$ref" in
                    ""|/) continue ;;
                    /*.*) continue ;;
                  esac
                  test -f "_site/${ref#/}.html" || echo "DEAD: $ref needs ${ref#/}.html (in $(basename "$js"))"
                done
          done >> /tmp/deadpaths.txt
          cat /tmp/deadpaths.txt
          test ! -s /tmp/deadpaths.txt || { echo "FATAL: the published site links to clean paths with no page behind them"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
