name: Deploy site to GitHub Pages

# The legacy Jekyll builder chokes on this repo (it tries to process the Python
# and JSON files alongside the site). This workflow uploads the static files
# as-is instead — no Jekyll, real build logs when something breaks.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; don't cancel one that's mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site directory
        run: |
          mkdir _site
          # Frontend only — the backend, training scripts and tooling are in the
          # repo for version control but must not be published to the web root.
          # *.css is NOT optional: it was missing from this glob, so app.css
          # 404'd in production and every page rendered unstyled — the mobile
          # tab bar and sidebar dumped as raw blocks at the foot of the page.
          cp *.html *.css *.js *.svg _site/
          cp trefle-data.json _site/
          cp CNAME .nojekyll _site/
          # These globs are FLAT — *.js does not descend into scripts/. That
          # directory went unpublished for its whole existence: api.js, ui.js,
          # router.js and all four view modules 404'd in production. It was
          # survivable only while every page carried its own inline copy of the
          # code; the moment directory.html started depending on api.js it
          # rendered an empty grid. Copy the tree, not a glob of it.
          cp -R scripts _site/
          # Tests ship in the repo, not to the web root.
          rm -f _site/scripts/*.test.mjs
          echo "--- published files ---"
          ls -la _site
          ls -la _site/scripts _site/scripts/views
          # Fail loudly rather than deploying a broken site again. Each of these
          # has already been shipped missing at least once.
          for f in app.css scripts/api.js scripts/ui.js scripts/router.js \
                   scripts/ux.js \
                   scripts/views/home.js scripts/views/directory.js \
                   scripts/views/dashboard.js scripts/views/scanner.js; do
            test -f "_site/$f" || { echo "FATAL: $f missing from _site"; exit 1; }
          done
          # Every same-origin src=/href= in the published HTML must resolve to a
          # real file. This is the check that would have caught both outages.
          for html in _site/*.html; do
            grep -oE '(src|href)="[^"#?:]+(\.js|\.css|\.svg|\.json)[^"]*"' "$html" \
              | sed -E 's/^(src|href)="//; s/"$//; s/\?.*$//' \
              | while read -r ref; do
                  case "$ref" in /*|http*) continue ;; esac
                  test -f "_site/$ref" || echo "MISSING: $ref (referenced by $(basename "$html"))"
                done
          done > /tmp/missing.txt
          cat /tmp/missing.txt
          test ! -s /tmp/missing.txt || { echo "FATAL: published HTML references files that were not deployed"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
