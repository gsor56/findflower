name: Deploy to HidenCloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hidencloud-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No HidenCloud panel credentials here on purpose. Their client API keys are
    # short-lived, so a restart cannot be issued from CI; server/supervisor.js runs
    # on the container instead and restarts the app when it sees the new stamp.
    env:
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_HOST_KEY: ${{ vars.SFTP_HOST_KEY }}
      SFTP_REMOTE_ROOT: ${{ vars.SFTP_REMOTE_ROOT || '/' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      BOOTSTRAP_REVISION: ${{ vars.HIDENCLOUD_BOOTSTRAP_REVISION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check deployment configuration
        shell: bash
        run: |
          # Every gap is reported at once. The loop used to exit on the first
          # missing name, so each re-run revealed only the next one. The split
          # matters because secrets and variables are separate tabs.
          missing=''
          for name in SFTP_PASSWORD CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              missing="$missing secret:$name"
            fi
          done
          for name in SFTP_HOST_KEY CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              missing="$missing variable:$name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::No files have been uploaded. Settings > Secrets and variables > Actions is missing:$missing"
            echo 'SFTP_HOST_KEY comes from scripts/hidencloud/sftp.py host-key; see scripts/hidencloud/README.md.'
            exit 1
          fi

      # express, mongoose, ejs and jose come from server/node_modules, so the
      # server suites cannot run until they are installed. --ignore-scripts
      # skips onnxruntime-node's postinstall, which downloads a large native
      # binary that none of the suites below load.
      - name: Install server dependencies
        working-directory: server
        run: npm ci --ignore-scripts

      - name: Verify routing and deployment safeguards
        run: |
          node proxy/worker.test.mjs
          node server/bearer.test.mjs
          node server/profile.test.mjs
          node server/scans.test.mjs
          node --test server/supervisor.test.mjs
          node --test scripts/hidencloud/deployment.test.mjs
          node --test scripts/hidencloud/verify-live.test.mjs
          node scripts/hidencloud/sync.integration.mjs
          node --test scripts/generate-showcase/contracts.test.js
          node --test scripts/generate-showcase/playback.test.js
          python -m unittest discover -s scripts/hidencloud -p '*_test.py'

      - name: Build only production files from this commit
        shell: bash
        run: |
          node scripts/hidencloud/manifest.mjs "$GITHUB_SHA" .hidencloud-local/bundle
          if [ -n "$BOOTSTRAP_REVISION" ]; then
            node scripts/hidencloud/manifest.mjs "$BOOTSTRAP_REVISION" .hidencloud-local/baseline
          fi

      # Paramiko speaks SFTP. FTP-Deploy-Action does not support this protocol.
      # The manifest allowlist excludes .git/**, .github/**, node_modules/**,
      # scripts/generate-showcase/scratch/**, all credentials and runtime state.
      - name: Install SFTP client
        run: python -m pip install paramiko==4.0.0

      - name: Deploy with conflict checks and backups
        shell: bash
        run: |
          args=()
          if [ -n "$BOOTSTRAP_REVISION" ]; then
            args+=(--baseline .hidencloud-local/baseline/deployment.json)
          fi
          python scripts/hidencloud/sftp.py deploy "${args[@]}"

      # The upload wrote .deploy/stamp last, so this is where the restart is
      # proved: the supervisor has to notice the stamp, install dependencies if
      # the lock moved, and bring the app up on the new commit. Failing here
      # leaves the Worker on the old files rather than half-switched.
      - name: Check that HidenCloud restarted onto this commit before switching traffic
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/hidencloud/verify-live.mjs --origin-only

      # Switch the Worker only after the updated backend has been installed.
      # Existing Worker secrets (including PROXY_SECRET) are retained by Wrangler.
      - name: Route pages, assets and models to HidenCloud
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: proxy
          command: deploy

      - name: Verify public page, models, PWA and inference
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/hidencloud/verify-live.mjs
