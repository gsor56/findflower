name = "findflower-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

# Every navigation route goes through this Worker; the Worker itself keeps
# static assets on their origin and hands everything else to the Node app.
#
# The two catch-alls below are the migration. Before them, each page needed its
# own pattern, so /dashboard, /profile and /about never reached the Worker and
# Cloudflare answered them from GitHub Pages' 404.html -- the static shell that
# boots a second login client and paints a signed-in visitor as signed out.
#
# Static assets are handled in worker.js rather than by a second route: a route
# pattern cannot express "everything except *.css", and the Worker's same-zone
# fetch() reaches the zone origin (Pages) without re-entering the Worker.
#
# To roll back without touching worker.js, delete the two catch-all lines: the
# explicit list below still covers every page the migrated site serves.
routes = [
  { pattern = "findflower.me/*", zone_name = "findflower.me" },
  { pattern = "www.findflower.me/*", zone_name = "findflower.me" },

  # Kept as the rollback path (see above): delete the two lines at the top and
  # these still route every page the site serves. A more specific pattern wins,
  # and they all point at this same Worker, so keeping them costs nothing.
  # The homepage is server-rendered too. Without these two patterns the request
  # never reaches this Worker, so Cloudflare answers / straight from GitHub
  # Pages -- a static document that cannot see the ff_session cookie and paints
  # every freshly signed-in visitor as signed out.
  { pattern = "findflower.me/", zone_name = "findflower.me" },
  { pattern = "www.findflower.me/", zone_name = "findflower.me" },
  { pattern = "findflower.me/health*", zone_name = "findflower.me" },
  { pattern = "findflower.me/server-login*", zone_name = "findflower.me" },
  { pattern = "findflower.me/login*", zone_name = "findflower.me" },
  { pattern = "findflower.me/logout*", zone_name = "findflower.me" },
  { pattern = "findflower.me/callback*", zone_name = "findflower.me" },
  { pattern = "findflower.me/api", zone_name = "findflower.me" },
  { pattern = "findflower.me/api/*", zone_name = "findflower.me" },
  { pattern = "findflower.me/community*", zone_name = "findflower.me" },
  { pattern = "findflower.me/chat*", zone_name = "findflower.me" },
  { pattern = "findflower.me/notifications*", zone_name = "findflower.me" },
  { pattern = "findflower.me/try*", zone_name = "findflower.me" },
  { pattern = "findflower.me/contribute*", zone_name = "findflower.me" },
  # The pages that used to fall through to Pages' 404.html. Each of these was a
  # URL that showed a signed-out header to a signed-in visitor.
  { pattern = "findflower.me/dashboard*", zone_name = "findflower.me" },
  { pattern = "findflower.me/profile*", zone_name = "findflower.me" },
  { pattern = "findflower.me/about*", zone_name = "findflower.me" },
  { pattern = "findflower.me/pricing*", zone_name = "findflower.me" },
  { pattern = "findflower.me/how*", zone_name = "findflower.me" },
  { pattern = "findflower.me/species*", zone_name = "findflower.me" },
  { pattern = "findflower.me/directory*", zone_name = "findflower.me" },
  { pattern = "findflower.me/contact*", zone_name = "findflower.me" },
  { pattern = "findflower.me/docs*", zone_name = "findflower.me" },
  { pattern = "findflower.me/research*", zone_name = "findflower.me" },
  { pattern = "findflower.me/data*", zone_name = "findflower.me" },
  { pattern = "findflower.me/blogs*", zone_name = "findflower.me" },
  { pattern = "findflower.me/releases*", zone_name = "findflower.me" },
  { pattern = "findflower.me/privacy*", zone_name = "findflower.me" },
  { pattern = "findflower.me/terms*", zone_name = "findflower.me" },
  { pattern = "findflower.me/feedback*", zone_name = "findflower.me" },
  { pattern = "findflower.me/article*", zone_name = "findflower.me" },
]

# Public config only. Secrets are NOT stored here — set them with:
#   wrangler secret put SPACE_TOKEN
#   wrangler secret put PROXY_SECRET
#
# CORS allowlist: dev + the production domain. A literal `*` is ignored by the
# Worker and falls back to https://findflower.me — this proxy never serves a
# wildcard.
[vars]
ALLOWED_ORIGINS = "http://localhost:8000,https://findflower.me"

# AUTH0_DOMAIN and AUTH0_AUDIENCE turn on full JWT verification in the Worker's
# auth gate: RS256 signature against the tenant's JWKS, plus issuer, audience
# and expiry. Both are required — the gate checks for the pair, so setting only
# one leaves the Worker in structure-only mode (any Bearer string passes).
#
# AUTH0_AUDIENCE must match AUTH0_AUDIENCE in try.html exactly, and an API with
# this identifier must exist in the Auth0 dashboard (Applications -> APIs), or
# Auth0 refuses to issue a token for it and signed-in users get no token at all.
AUTH0_DOMAIN   = "dev-jvit0r04itv8hfjz.us.auth0.com"
AUTH0_AUDIENCE = "https://api.findflower.me"

# The auth gate is DISARMED — deliberately, 2026-08-08, pre-production.
#
# ENFORCE_AUTH fails CLOSED: only the literal string "false" disarms it, so an
# absent, empty or misspelled value enforces and a typo can never open the
# proxy by accident. Opening it has to look exactly like the line below.
#
# Disarmed does NOT mean unchecked. The Worker still verifies every token it is
# given — RS256 signature against the tenant's JWKS, issuer, audience, expiry —
# and reports the verdict in the X-FF-Auth response header. It just serves the
# request either way. That is the point: `ok` in that header on a real
# signed-in scan is the evidence that re-arming is safe, and it keeps
# accumulating while the gate is down.
#
# 2026-09-02: it only started accumulating on that date. try.html had
# SEND_AUTH_TOKEN = false all through the dry run, so the page sent no header at
# all and every audit line read `would-reject: Authorization header is required`,
# guest and signed-in alike. The dry run could not produce its own exit
# criterion. That switch is now true while REQUIRE_SIGN_IN stays false, so a
# signed-in visitor's token goes up and a guest still scans without one.
#
# Still standing while this is open, so the model is not a free public API:
#   - the ALLOWED_ORIGINS gate above (other websites' browsers are refused)
#   - X-Proxy-Secret, which the Space checks for itself
# Neither survives a determined curl, so treat this as a window, not a state.
#
# TO RE-ARM: delete the ENFORCE_AUTH line, `wrangler deploy`, and flip
# REQUIRE_SIGN_IN back to true in try.html. Both together — sign-in off with
# the Worker armed means every guest scan 401s after the upload.
#
# Rolled out 2026-08-08 with no downtime by using this same lever: deploy
# disarmed -> publish frontend -> confirm X-FF-Auth read `ok` -> remove the var
# and redeploy. Reuse that sequence for any change that tightens the gate.
#
# This lever does not reach the public API. `POST /v1/identify` requires a
# verified token whatever this is set to, because every call to it draws on the
# shared developer pool and an anonymous caller must not be able to spend one.
# The lever governs the app's own scanner (`POST /internal/scan`) only, which is
# how "disarmed" and a locked-down API can both be true at the same time.
ENFORCE_AUTH = "false"

# Where the server-rendered pages live. The Node application on HidenCloud owns
# every navigation route -- /community, /chat, /notifications, /try,
# /contribute, /dashboard, /profile, /about, /api and the auth routes -- so one
# origin serves both the page and the API it calls, which is what keeps the
# session cookie same-origin and the signed-in header on every screen.
#
# Leave this unset and every path keeps answering from GitHub Pages, exactly as
# before. Set it and the Worker becomes the front door for the whole site;
# /trefle/, the inference routes, the warm-up poke and the static assets are
# untouched either way (assets are forwarded to the Pages origin, see worker.js).
SITE_UPSTREAM = "http://pat.hidencloud.com:24729"

[[durable_objects.bindings]]
name = "GLOBAL_INFERENCE_BUDGET"
class_name = "GlobalInferenceBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GlobalInferenceBudget"]
