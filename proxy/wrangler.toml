name = "findflower-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

# Public config only. Secrets are NOT stored here — set them with:
#   wrangler secret put SPACE_TOKEN
#   wrangler secret put PROXY_SECRET
#
# CORS allowlist: dev + the production domain. A literal `*` is ignored by the
# Worker and falls back to https://findflower.me — this proxy never serves a
# wildcard.
[vars]
ALLOWED_ORIGINS = "http://localhost:8000,https://findflower.me"

# AUTH0_DOMAIN and AUTH0_AUDIENCE turn on full JWT verification in the Worker's
# auth gate: RS256 signature against the tenant's JWKS, plus issuer, audience
# and expiry. Both are required — the gate checks for the pair, so setting only
# one leaves the Worker in structure-only mode (any Bearer string passes).
#
# AUTH0_AUDIENCE must match AUTH0_AUDIENCE in try.html exactly, and an API with
# this identifier must exist in the Auth0 dashboard (Applications -> APIs), or
# Auth0 refuses to issue a token for it and signed-in users get no token at all.
AUTH0_DOMAIN   = "findflower.au.auth0.com"
AUTH0_AUDIENCE = "https://api.findflower.me"

# The auth gate is ARMED. There is deliberately no ENFORCE_AUTH line here:
# the Worker fails CLOSED, so an absent var enforces. Only the literal string
# "false" disarms it, which means a typo can never leave the proxy open.
#
# To disarm — and this is an emergency lever, not a routine one — add
#
#   ENFORCE_AUTH = "false"
#
# and redeploy. The Worker then evaluates every request exactly as it does now
# and reports the verdict in the X-FF-Auth response header, but serves it
# regardless. That is what made the original rollout seamless: the Worker
# accepted the Authorization header for a while before it started requiring
# one, so the Worker and the frontend could ship in either order without a
# window where scanning was broken.
#
# Rolled out 2026-08-08: deploy disarmed -> publish frontend -> confirm
# X-FF-Auth read `ok` on a real signed-in scan -> remove the var and redeploy.
# Reuse that sequence for any future change that tightens the gate.
