# Render Blueprint for the FindFlower inference server.
# Deploy: push this folder to a Git repo, then New + > Blueprint on render.com,
# point it here. Set the two secret env vars in the dashboard (marked sync:false).
services:
  - type: web
    name: findflower-vit
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: HF_TOKEN
        sync: false          # set in dashboard: your HF read token
      - key: PROXY_SECRET
        sync: false          # set in dashboard: the shared secret (see below)
