<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | FindFlower</title>
    <meta name="description" content="Private messages and friend requests on FindFlower.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="app.css?v=14">
    <script src="prefs.js?v=1"></script>
    <script src="i18n.js?v=1" defer></script>
    <script src="nav.js?v=8" defer></script>
    <script src="scripts/notifications.js?v=1" defer></script>
    <script src="footer.js?v=4" defer></script>
    <script src="scripts/ux.js?v=1" defer></script>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
    <script src="auth.js?v=6"></script>
    <script>window.FF_SOCIAL_API='https://findflower-proxy.fofi.workers.dev/v1/community';</script>
    <script src="scripts/social.js?v=3" defer></script>
    <script src="scripts/views/chat.js?v=1" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],serif:['Fraunces','serif']},colors:{sage:{500:'#5F7A63',700:'#3D5341'}}}}};</script>
    <style>body{background:#FCFCFC;color:#171717;-webkit-font-smoothing:antialiased}.ff-spin{width:18px;height:18px;border:2px solid #171717;border-top-color:transparent;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.ff-spin{animation:none}}</style>
</head>
<body class="font-sans antialiased selection:bg-[#dfe8e1] selection:text-[#1a3622]">
<header class="fixed top-0 left-0 right-0 z-50 bg-[#FCFCFC] border-b border-black"><div class="max-w-3xl mx-auto px-5 h-16 flex items-center justify-between"><a href="/" class="font-medium">FindFlower</a><a href="/community" class="text-sm">Community</a></div></header>
<main class="pt-28 pb-24"><div class="max-w-3xl mx-auto px-5 sm:px-8">
    <div id="chatLoading" class="hidden border border-black rounded-none p-4 text-sm"><span class="ff-spin inline-block align-middle mr-2"></span>Loading…</div>
    <p id="chatNote" class="hidden border border-black rounded-none p-3 text-sm mb-4" role="status"></p>
    <section id="chatInbox">
        <p class="text-xs uppercase tracking-wider text-[#1a3622]">Notifications</p>
        <h1 class="font-serif text-4xl sm:text-5xl mt-3">Messages and requests</h1>
        <p class="text-sm text-neutral-600 mt-4 mb-8">Friend requests and unread private messages. Nothing is pushed outside the app.</p>
        <ul id="chatNotifications" class="space-y-3"></ul>
        <p id="chatInboxEmpty" class="hidden border border-black rounded-none p-5 text-sm text-neutral-600">Nothing waiting for you.</p>
    </section>
    <section id="chatConversation" class="hidden">
        <a href="/community" class="text-xs uppercase hover:underline">← Back to Global</a>
        <div class="border-b border-black pb-4 mt-5"><h1 id="chatTitle" class="font-serif text-4xl"></h1><p id="chatHandle" class="text-sm text-neutral-500 mt-1"></p></div>
        <button id="chatMore" type="button" class="hidden w-full border border-black rounded-none p-2 text-xs uppercase mt-5 hover:bg-neutral-100">Load older messages</button>
        <ul id="chatMessages" class="space-y-3 my-5" aria-live="polite"></ul>
        <p id="chatEmpty" class="hidden text-sm text-neutral-500 my-5">No messages yet.</p>
        <form id="chatForm" class="border border-black rounded-none p-3 flex gap-2">
            <label for="chatBody" class="sr-only">Message</label>
            <textarea id="chatBody" rows="2" maxlength="2000" required placeholder="WRITE A MESSAGE…" class="min-w-0 flex-1 border border-black rounded-none p-2 text-sm resize-y focus:outline-none focus:ring-1 focus:ring-black"></textarea>
            <button id="chatSend" class="self-end border border-black rounded-none bg-[#1a3622] text-white px-4 py-2 text-xs uppercase disabled:opacity-40">Send</button>
        </form>
    </section>
</div></main>
<div id="ff-footer"></div>
</body>
</html>
